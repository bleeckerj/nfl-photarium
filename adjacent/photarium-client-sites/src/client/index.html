<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Photarium Client Site</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="review-bar">
        <div class="review-bar__meta">
          <p class="review-bar__eyebrow">Client selection</p>
          <h1 id="project-title" class="review-bar__title">Loading project…</h1>
          <p id="project-summary" class="review-bar__summary">
            Preparing the curated image set.
          </p>
        </div>
        <div class="review-bar__metrics">
          <div class="metric">
            <span class="metric__label">In view</span>
            <span id="visible-count" class="metric__value">0</span>
          </div>
          <div class="metric">
            <span class="metric__label">Selected</span>
            <span id="selected-count" class="metric__value">0</span>
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="toolbar">
          <p id="toolbar-copy" class="toolbar__copy">
            Filter by visible tags. Open any image for downloads and a larger review.
          </p>
          <div id="tag-filter-bar" class="tag-filter-bar"></div>
        </section>

        <section id="gallery-root" class="gallery-root"></section>
      </main>

      <aside id="shortlist-drawer" class="shortlist-drawer"></aside>
    </div>

    <div id="lightbox-root"></div>
    <script type="module" src="/main.ts"></script>
  </body>
  </html>
