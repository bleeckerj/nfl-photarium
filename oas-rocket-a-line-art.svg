<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">OAS rocket A line-art logo</title>
  <desc id="desc">A dark charcoal outline logo reading OAS, with the A shaped like a geometric rocket ship. The surrounding circle is omitted.</desc>

  <g fill="none" stroke="#1c1c1c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- O: double contour, preserved as a simple outlined letter. -->
