<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-label="Grainrad effect preview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2f2ed"/>
      <stop offset="0.45" stop-color="#d8ddd8"/>
      <stop offset="1" stop-color="#20242a"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.78" numOctaves="2" seed="7" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="scan" width="960" height="12" patternUnits="userSpaceOnUse">
      <rect width="960" height="6" fill="#111827" opacity="0.12"/>
      <rect y="6" width="960" height="6" fill="#f8fafc" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="960" height="576" fill="url(#bg)"/>
  <g filter="url(#grain)">
    <circle cx="276" cy="276" r="162" fill="#e7e0cd"/>
    <circle cx="308" cy="260" r="128" fill="#141820" opacity="0.84"/>
    <rect x="438" y="126" width="286" height="304" rx="16" fill="#eef0ec"/>
    <rect x="466" y="158" width="230" height="28" fill="#111827"/>
    <rect x="466" y="216" width="196" height="20" fill="#111827" opacity="0.78"/>
    <rect x="466" y="266" width="238" height="20" fill="#111827" opacity="0.62"/>
    <rect x="466" y="316" width="168" height="20" fill="#111827" opacity="0.5"/>
    <path d="M160 438h662" stroke="#c12f42" stroke-width="18" opacity="0.82"/>
    <path d="M146 464h662" stroke="#26a69a" stroke-width="14" opacity="0.74"/>
    <path d="M180 490h560" stroke="#2b6cb0" stroke-width="12" opacity="0.72"/>
  </g>
  <rect width="960" height="576" fill="url(#scan)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" fill="#111827">
    <text x="48" y="64">GRAINRAD</text>
    <text x="48" y="104" font-size="16" opacity="0.65">vhs / threshold / dithering</text>
  </g>
</svg>
